  const g = prefsGeo(c);

    const r = g.sw(i);
    if (i === PR.sel) { frame(r.x - 3, r.y - 3, r.w + 6, r.h + 6, WH); frame(r.x - 2, r.y - 2, r.w + 4, r.h + 4, BK); }
    fill(r.x, r.y, r.w, r.h, PAL[i]); frame(r.x, r.y, r.w, r.h, BK);
  }
  const v = PR.cur[PR.sel];
  for (let k = 0; k < 3; k++) {
    const y = g.sl(k);
    text("RGB"[k], c.x + 8, y + 1, WH);
    frame(g.tx, y, g.tw, 10, WH); frame(g.tx - 1, y - 1, g.tw + 2, 12, BK);
    const kx = g.tx + 2 + Math.round(v[k] * (g.tw - 4 - g.kw) / 15);
    fill(kx, y + 2, g.kw, 6, WH); frame(kx, y + 2, g.kw, 6, BK);

function pressPrefs(p, c) {
  const g = prefsGeo(c);

  for (let k = 0; k < 3; k++) {
    const y = g.sl(k);
    if (p.y < y - 1 || p.y >= y + 11 || p.x < g.tx - 4 || p.x >= g.tx + g.tw + 4) continue;
    const set = q => {
      const v = clamp(Math.round((q.x - g.tx - 2 - g.kw / 2) * 15 / (g.tw - 4 - g.kw)), 0, 15);
      if (PR.cur[PR.sel][k] === v) return;

}

const CALC_KEYS = [["CA", "CE", "<-", "/"], ["7", "8", "9", "*"], ["4", "5", "6", "-"], ["1", "2", "3", "+"], ["0", ".", "+-", "="]];

function calcIn(k) {

  else if (k === "+-") { if (!/^(0|Error)$/.test(CL.disp)) CL.disp = CL.disp[0] === "-" ? CL.disp.slice(1) : "-" + CL.disp; }

  else if (k === "CE") { CL.disp = "0"; CL.fresh = true; }
  else if (k === "CA") { CL.disp = "0"; CL.acc = null; CL.op = null; CL.fresh = true; }

function fillPoly(pts, c) {

  for (let y = Math.ceil(mn); y <= Math.floor(mx); y++) {
    const xs = [];

      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) fill(Math.round(xs[k]), y, Math.max(1, Math.round(xs[k + 1]) - Math.round(xs[k]) + 1), 1, c);

let boot = { lines:[], cur:"", skip:false }, wake = null;

  deselectAll(); layoutDesk(true);

  const b = boot;
  const sl = ms => b.skip ? Promise.resolve() : new Promise(r => { const t = setTimeout(r, ms); wake = () => { clearTimeout(t); r(); }; });

function resize() {

function shellKey(e) {

  if (e.key === "Enter") { exec(sh.inp); sh.inp = ""; }
  else if (e.key === "Backspace") sh.inp = sh.inp.slice(0, -1);
  else if (e.key === "ArrowUp")   { if (sh.hp > 0) sh.inp = sh.hist[--sh.hp]; }
  else if (e.key === "ArrowDown") { if (sh.hp < sh.hist.length) { sh.hp++; sh.inp = sh.hist[sh.hp] || ""; } }

}

  if (mode === "xcopy" && (e.key === "Escape" || e.key === "q")) { XC.abort = true; mode = "wb"; dirty(); return true; }

        ["RELEASE RATE " + L.rate + ", " + L.time + " MINUTES"], [""], [L.hint, 3], [""], ["CLICK TO START"]]);
      if (st === "result") {
        const r = result, last8 = lv === LV.length - 1;
        box([[timeUp ? "TIME IS UP" : "ALL BITLINGS ACCOUNTED FOR", 3], [""], ["YOU RESCUED " + String(r.pct).padStart(3) + "%"], ["YOU NEEDED  " + String(r.needPct).padStart(3) + "%"], [""],
          [r.pct === 100 ? "EVERY SINGLE BIT. SUPERB!" : r.ok ? "WELL DONE." : r.pct ? "NOT QUITE. TRY AGAIN." : "BIT ROT. TOTAL LOSS.", r.ok ? 3 : 1], [""],
          [r.ok ? (last8 ? "ALL EIGHT LEVELS DONE!" : "CLICK FOR LEVEL " + (lv + 2)) : "CLICK TO RETRY"], ["ESC FOR THE MENU", DIM]]);

    const lut = RGB.map(([r, g, b]) => (255 << 24 | b << 16 | g << 8 | r) >>> 0);

  /* -- input -- */
  function play(i) { load(i); st = "intro"; }

  return { start, stop, draw, key, pointer, LV,
    _dbg: { load, fb, render, tick, give, get crs() { return crs; }, get saved() { return saved; }, get st() { return st; }, set st(v) { st = v; },
            get T() { return T; }, get result() { return result; }, mat, solid } };
})();

  const a = -0.2, ca = Math.cos(a), sa = Math.sin(a);
  for (let y = 0; y < 22; y++) for (let x = 0; x < 34; x++) {
    const dx = x + .5 - 18, dy = (y + .5 - 13.5) * 2;                    // hires: a line is twice as tall as wide

      const d = Math.hypot(u, v * 1.1);
      c = Math.abs(u) > 11 || Math.abs(v) > 7.6 ? 2

      const r = v < -14 ? Math.hypot(u, v + 14) : Math.abs(u);
      if (r > 5.2 && r < 10) c = r < 6.6 || r > 8.6 ? 2 : 1;
