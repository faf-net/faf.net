const FB = Uint8Array.from(atob(FONT), c => c.charCodeAt(0));

let RGB = PAL.map(hexRGB);

const ctx = cv.getContext("2d", { alpha:false, willReadFrequently:true });

let LW = 640, LH = 256;                  // logical screen: hires pixels × lines

/* ---------- low-level drawing ---------------------------------------- */
function fill(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function frame(x, y, w, h, c) {
  fill(x, y, w, 1, c); fill(x, y + h - 1, w, 1, c);
  fill(x, y, 1, h, c); fill(x + w - 1, y, 1, h, c);
}
function line(x0, y0, x1, y1, c, t = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  ctx.fillStyle = c;
  for (;;) {
    ctx.fillRect(x0, y0, t, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function ellipse(cx, cy, rx, ry, c) {
  for (let y = -ry; y <= ry; y++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    fill(cx - hw, cy + y, hw * 2 + 1, 1, c);
  }
}

// complement mode, like Intuition: blue<->orange, white<->black
const CMAP = new Map();
const buildCMAP = () => { CMAP.clear(); RGB.forEach((c, i) => CMAP.set((c[0] << 16) | (c[1] << 8) | c[2], RGB[i ^ 3])); };
buildCMAP();
function comp(x, y, w, h) {
  const x0 = Math.max(0, x | 0), y0 = Math.max(0, y | 0);
  const x1 = Math.min(LW, (x + w) | 0), y1 = Math.min(LH, (y + h) | 0);
  if (x1 <= x0 || y1 <= y0) return;
  const id = ctx.getImageData(x0, y0, x1 - x0, y1 - y0), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const m = CMAP.get((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]);
    if (m) { d[i] = m[0]; d[i + 1] = m[1]; d[i + 2] = m[2]; }
  }
  ctx.putImageData(id, x0, y0);
}
function compFrame(x, y, w, h) {
  comp(x, y, w, 1); comp(x, y + h - 1, w, 1);
  comp(x, y + 1, 1, h - 2); comp(x + w - 1, y + 1, 1, h - 2);
}

/* ---------- Topaz text ------------------------------------------------ */
const gi = ch => { let c = ch.charCodeAt(0); if (c === 160) c = 32; return (c >= 32 && c <= 255) ? c - 32 : 31; };
const atlases = {};
function atlas(col) {
  if (atlases[col]) return atlases[col];
  const c = document.createElement("canvas"); c.width = 224 * 8; c.height = 8;
  const x = c.getContext("2d"), id = x.createImageData(c.width, 8), [r, g, b] = hexRGB(col);
  for (let i = 0; i < 224; i++) for (let row = 0; row < 8; row++) {
    const bits = FB[i * 8 + row];
    for (let bit = 0; bit < 8; bit++) if (bits & (128 >> bit)) {
      const p = (row * c.width + i * 8 + bit) * 4;
      id.data[p] = r; id.data[p + 1] = g; id.data[p + 2] = b; id.data[p + 3] = 255;
    }
  }
  x.putImageData(id, 0, 0);
  return (atlases[col] = c);
}
function text(s, x, y, col, bg) {
  s = String(s);
  if (bg) fill(x, y, s.length * 8, 8, bg);
  const a = atlas(col);
  for (let i = 0; i < s.length; i++) ctx.drawImage(a, gi(s[i]) * 8, 0, 8, 8, x + i * 8, y, 8, 8);
}

/* ---------- icons: drawn into 4-colour index buffers ------------------ */
function makeIcon(w, h, fn) {
  const d = new Uint8Array(w * h);
  const g = {
    px(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < w && y < h) d[y * w + x] = c; },
    rect(x, y, ww, hh, c) { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) g.px(i, j, c); },
    frame(x, y, ww, hh, c) { g.rect(x, y, ww, 1, c); g.rect(x, y + hh - 1, ww, 1, c); g.rect(x, y, 1, hh, c); g.rect(x + ww - 1, y, 1, hh, c); },
    line(x0, y0, x1, y1, c) {
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let e = dx + dy;
      for (;;) { g.px(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
    },
    poly(p, f, o) {
      let mn = 1e9, mx = -1e9;
      p.forEach(q => { mn = Math.min(mn, q[1]); mx = Math.max(mx, q[1]); });
      for (let y = mn; y <= mx; y++) {
        const xs = [];
        for (let i = 0; i < p.length; i++) {
          const a = p[i], b = p[(i + 1) % p.length];
          if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
        }
        xs.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x <= Math.round(xs[k + 1]); x++) g.px(x, y, f);
      }
      if (o != null) for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; g.line(a[0], a[1], b[0], b[1], o); }
    },
    ell(cx, cy, rx, ry, f, o) {
      for (let y = -ry; y <= ry; y++) { const hw = Math.round(rx * Math.sqrt(1 - (y * y) / (ry * ry))); g.rect(cx - hw, cy + y, hw * 2 + 1, 1, f); }
      if (o != null) for (let a = 0; a < 360; a += 2) { const r = a * Math.PI / 180; g.px(Math.round(cx + rx * Math.cos(r)), Math.round(cy + ry * Math.sin(r)), o); }
    },
    txt(s, x, y, c) {
      for (let i = 0; i < s.length; i++) { const o = gi(s[i]) * 8; for (let r = 0; r < 8; r++) { const bits = FB[o + r]; for (let b = 0; b < 8; b++) if (bits & (128 >> b)) g.px(x + i * 8 + b, y + r, c); } }
    }
  };
  fn(g);
  const mk = xor => {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d"), id = x.createImageData(w, h);
    for (let i = 0; i < w * h; i++) { const col = RGB[d[i] ^ xor]; id.data.set([col[0], col[1], col[2], 255], i * 4); }
    x.putImageData(id, 0, 0);
    return c;
  };
  const ic = { w, h };
  ic.paint = () => { ic.n = mk(0); ic.s = mk(3); };   // n = normal, s = selected (complemented)
  ic.paint();
  return ic;
}

function setTheme(id) {
  theme = id;
  const T = THEMES[id];
  PAL = T.pal; [BL, WH, BK, OR] = PAL; RGB = PAL.map(hexRGB); SPR = T.spr; GURU = T.guru;
  buildCMAP();
  Object.values(ICON).forEach(ic => ic.paint());
  document.body.style.background = document.documentElement.style.background = BL;
  document.querySelector('meta[name="theme-color"]').content = BL;
  try { localStorage.setItem("faf-wb-theme", id); } catch (_) {}
}
function toggleTheme() {
  setTheme(theme === "amiga" ? "workbench" : "amiga");
  busy(500);
  titleMsg = { t:"Palette: " + THEMES[theme].name, until:performance.now() + 3000 };
}

function drawSprite(map, x, y) {
  for (let r = 0; r < map.length; r++) for (let c = 0; c < map[r].length; c++) {
    const ch = map[r][c]; if (ch !== ".") fill(x + c * 2, y + r, 2, 1, SPR[ch]);

}

const mkIcon = (label, img, act) => ({ label, img, act, cx:0, y:0, rx:0, sel:false, lw:label.length * 8 });

function layoutDesk(reset) {

/* ---------- windows --------------------------------------------------- */
const metrics = w => w.type === "drawer" ? { L: w.gauge ? 18 : 4, R: 18, T: 11, B: 9 } : { L: 4, R: 4, T: 11, B: 2 };
function content(w) { const m = metrics(w); return { x: w.x + m.L, y: w.y + m.T, w: w.w - m.L - m.R, h: w.h - m.T - m.B }; }

function layoutIcons(w) {
  const c = content(w), cell = 78, cols = Math.max(1, Math.floor((c.w - 8) / cell));
  w.icons.forEach((ic, i) => { ic.cx = 4 + (cell >> 1) + (i % cols) * cell; ic.y = 4 + Math.floor(i / cols) * 36; });
}

function openWin(o) {
  const ex = wins.find(w => w.id === o.id);
  if (ex) { raise(ex); active = ex; return ex; }
  const w = Object.assign({ icons:[], lines:[] }, o);
  w.w = Math.min(w.w, LW - 8);
  w.h = Math.min(w.h, LH - 14);
  w.x = clamp(w.x, 0, LW - w.w);
  w.y = clamp(w.y, 11, LH - w.h);
  if (w.type === "drawer") layoutIcons(w);
  wins.push(w); active = w;
  busy(450);
  return w;
}
function raise(w) { const i = wins.indexOf(w); if (i >= 0) { wins.splice(i, 1); wins.push(w); } }
function closeWin(w) {
  const i = wins.indexOf(w); if (i < 0) return;
  wins.splice(i, 1);
  if (active === w) active = wins[wins.length - 1] || null;
  if (w.type === "shell") kbd.blur();
}
const cascade = () => wins.length * 14;

function openDisk() {

    icons: [ mkIcon("About", "doc", openAbout), mkIcon("WOPR", "wopr", goWopr),
             mkIcon("Clock", "clock", openClock), mkIcon("Shell", "shell", openShell),
             mkIcon("GitHub", "github", goGithub), mkIcon("Workbench", "palette", toggleTheme),
             mkIcon("Trashcan", "trash", openTrash) ] });
}

function openTrash() { openWin({ id:"trash", title:"Trashcan", type:"drawer", gauge:false, mem:2048, x:60 + cascade(), y:60 + cascade(), w:200, h:70 }); }

  openWin({ id:"shell", title:"AmigaShell", type:"shell", mem:13456, x:10 + cascade(), y:LH - 130, w:Math.min(560, LW - 20), h:118 });

/* ---------- window chrome --------------------------------------------- */
function depthGadgets(dx, y) {
  fill(dx, y + 1, 1, 9, BK); fill(dx + 23, y + 1, 1, 9, BK);
  fill(dx + 9, y + 4, 10, 5, WH); frame(dx + 9, y + 4, 10, 5, BK); fill(dx + 4, y + 2, 10, 5, BK);
  fill(dx + 27, y + 2, 10, 5, BK); fill(dx + 32, y + 4, 10, 5, WH); frame(dx + 32, y + 4, 10, 5, BK);
}
function titleBar(x, y, w, title, act, close) {
  fill(x, y, w, 11, WH);
  let tx = x + 4;
  if (close) { frame(x + 4, y + 2, 12, 7, BK); fill(x + 9, y + 4, 2, 3, BK); fill(x + 20, y + 1, 1, 9, BK); tx = x + 24; }
  const dx = x + w - 46;
  const t = title.slice(0, Math.max(0, Math.floor((dx - 4 - tx) / 8)));
  text(t, tx, y + 2, BL);
  if (act) {
    const s = tx + t.length * 8 + (t ? 6 : 0), e = dx - 4;
    if (e > s) for (let r = 2; r <= 8; r += 2) fill(s, y + r, e - s, 1, BL);
  }
  depthGadgets(dx, y);
}
function arrow(dir, x, y) {            // into an 16×9 box
  const cx = x + 8, cy = y + 4;
  if (dir === "u" || dir === "d") {
    const s = dir === "u" ? -1 : 1;
    fill(cx - 1, cy - 2, 2, 5, BL);
    for (let i = 0; i < 3; i++) fill(cx - 1 - i * 2, cy + s * (3 - i), 2 + i * 4, 1, BL);
  } else {
    const s = dir === "l" ? -1 : 1;
    fill(cx - 4, cy, 9, 1, BL);
    for (let i = 0; i < 3; i++) fill(cx + s * (5 - i * 2) - 1, cy - i, 2, 1 + i * 2, BL);
  }
}
function sizeGadget(x, y) { frame(x + 3, y + 1, 11, 7, BL); frame(x + 3, y + 1, 6, 4, BL); }
function gauge(w) {
  const x = w.x + 4, y = w.y + 11, h = w.h - 20;
  fill(x, y, 10, h, BK);
  text("F", x + 1, y + 1, WH); text("E", x + 1, y + h - 9, WH);
  const top = y + 10, bot = y + h - 10, H = Math.max(0, bot - top), f = Math.round(H * (w.fill || 0));
  fill(x + 2, bot - f, 6, f, OR);
}
function scrollers(w) {
  const rx = w.x + w.w - 18, by = w.y + w.h - 9, top = w.y + 11;
  fill(rx, top, 1, by - top, BK); fill(w.x, by, w.w - 18, 1, BK);
  arrow("u", rx + 1, top + 1); arrow("d", rx + 1, by - 10);
  frame(rx + 4, top + 11, 11, Math.max(2, by - top - 23), BL);
  arrow("l", w.x + 1, by + 1); arrow("r", rx - 17, by + 1);
  frame(w.x + 19, by + 2, Math.max(2, rx - w.x - 38), 6, BL);
  sizeGadget(rx + 1, by);
}

function drawWin(w) {
  const act = w === active, c = content(w);
  fill(w.x, w.y, w.w, w.h, WH);
  fill(c.x, c.y, c.w, c.h, BL);
  titleBar(w.x, w.y, w.w, w.title, act, true);
  if (w.type === "drawer") { if (w.gauge) gauge(w); scrollers(w); }
  ctx.save(); ctx.beginPath(); ctx.rect(c.x, c.y, c.w, c.h); ctx.clip();
  if (w.type === "drawer") w.icons.forEach(ic => drawIcon(ic, c.x, c.y));
  else if (w.type === "text") aboutLines().forEach((s, i) => text(s, c.x + 4, c.y + 2 + i * 8, i === 0 ? OR : WH));
  else if (w.type === "clock") drawClock(c);
  else if (w.type === "shell") drawShell(c, act);
  ctx.restore();
  if (w.type !== "drawer") { const sx = w.x + w.w - 20, sy = w.y + w.h - 11; fill(sx, sy, 16, 9, WH); sizeGadget(sx, sy); }
}

function drawIcon(ic, ox, oy) {
  const im = ICON[ic.img], ix = ox + ic.cx - (im.w >> 1), iy = oy + ic.y;
  ctx.drawImage(ic.sel ? im.s : im.n, ix, iy);
  text(ic.label, ox + ic.cx - (ic.lw >> 1), iy + im.h + 2, WH);
}
function iconHit(list, x, y) {
  for (let i = list.length - 1; i >= 0; i--) {
    const ic = list[i], im = ICON[ic.img], hw = Math.max(im.w, ic.lw) >> 1;
    if (x >= ic.cx - hw && x < ic.cx + hw && y >= ic.y && y < ic.y + im.h + 11) return ic;
  }
  return null;
}
function allIcons() { return deskIcons.concat(...wins.map(w => w.icons)); }
function deselectAll() { allIcons().forEach(ic => { ic.sel = false; }); }

/* ---------- clock & shell --------------------------------------------- */
function drawClock(c) {
  const cx = c.x + (c.w >> 1), cy = c.y + (c.h >> 1);
  const rx = Math.max(10, Math.min((c.w >> 1) - 8, ((c.h >> 1) - 3) * 2)), ry = rx >> 1;
  ellipse(cx, cy, rx, ry, BK); ellipse(cx, cy, rx - 2, ry - 1, WH);
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, tx = cx + Math.round((rx - 6) * Math.sin(a)), ty = cy - Math.round((ry - 3) * Math.cos(a));
    if (i % 3) fill(tx - 1, ty, 2, 1, BK); else fill(tx - 2, ty - 1, 4, 2, BL);
  }
  const d = new Date(), s = d.getSeconds(), m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
  const hand = (frac, len, col, t) => { const a = frac * 2 * Math.PI; line(cx, cy, cx + (rx - 4) * len * Math.sin(a), cy - (ry - 2) * len * Math.cos(a), col, t); };
  hand(h / 12, .55, BK, 3); hand(m / 60, .85, BK, 2); hand(s / 60, .9, OR, 1);
  fill(cx - 1, cy, 3, 1, OR);
}
function wrapInto(out, s, cols) {
  if (!s.length) { out.push(""); return; }
  for (let i = 0; i < s.length; i += cols) out.push(s.slice(i, i + cols));
}
function drawShell(c, act) {
  const cols = Math.max(1, Math.floor((c.w - 4) / 8)), rows = Math.max(1, Math.floor((c.h - 2) / 8));
  const all = [];
  sh.lines.forEach(s => wrapInto(all, s, cols));
  wrapInto(all, "1> " + sh.inp, cols);
  const vis = all.slice(-rows);
  vis.forEach((s, i) => text(s, c.x + 2, c.y + 1 + i * 8, WH));
  if (act) fill(c.x + 2 + vis[vis.length - 1].length * 8, c.y + 1 + (vis.length - 1) * 8, 8, 8, OR);
}

const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const p2 = n => String(n).padStart(2, "0");
const amigaDate = (d = new Date()) =>
  `${DAYS[d.getDay()]} ${p2(d.getDate())}-${MONS[d.getMonth()]}-${p2(d.getFullYear() % 100)} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;

function exec(raw) {
  sh.lines.push("1> " + raw);
  if (raw.trim()) { sh.hist.push(raw); }
  sh.hp = sh.hist.length;
  const parts = raw.trim().split(/\s+/), c0 = parts[0] || "", cmd = c0.toLowerCase(), arg = parts.slice(1).join(" ");
  const out = s => sh.lines.push(s);
  const fm = freeMem();
  switch (cmd) {
    case "": break;
    case "help": case "?":
      out("DIR INFO DATE AVAIL VERSION ECHO TYPE");
      out("ABOUT CLOCK WOPR GITHUB PALETTE CLS ENDCLI"); break;
    case "dir": case "list":
      out("     Trashcan (dir)"); out("  About     Clock     GitHub    Shell");  out("  Workbench WOPR"); break;
    case "info":
      out("Unit Size  Used Free Full Errs Status   Name");
      out("DF0: 880K  1386  372  79%   0  Read/Write faf.net");
      out("RAM:   7K    14    0 100%   0  Read/Write RAM DISK"); break;
    case "date": out(amigaDate()); break;
    case "avail":
      out("Type  Available   In-Use  Maximum  Largest");
      out(`chip  ${String(fm - 524288).padStart(9)} ${String(524288 * 2 - fm).padStart(8)}   524288 ${String(fm - 524288 - 9120).padStart(8)}`);
      out(`fast  ${String(524288).padStart(9)} ${String(0).padStart(8)}   524288   524288`);
      out(`total ${String(fm).padStart(9)} ${String(524288 * 2 - fm).padStart(8)}  1048576   524288`); break;
    case "version": out("Kickstart version 34.5. Workbench version 34.34"); break;
    case "echo": out(arg.replace(/^"(.*)"$/, "$1")); break;
    case "type":
      if (/^about(\.txt)?$/i.test(arg)) aboutLines().forEach(out);
      else if (/^s:startup-sequence$/i.test(arg)) ["SetPatch >NIL:", "Echo \"faf.net Workbench Disk.\"", "LoadWB", "EndCLI >NIL:"].forEach(out);
      else if (!arg) out("TYPE: required argument missing");
      else out("Can't open " + arg);
      break;
    case "about": openAbout(); break;
    case "clock": openClock(); break;
    case "palette": out("Palette: " + THEMES[theme === "amiga" ? "workbench" : "amiga"].name); toggleTheme(); break;
    case "github": case "git": out("Opening " + GITHUB + " ..."); goGithub(); break;
    case "wopr": case "joshua": out("Connecting to WOPR ..."); goWopr(); break;
    case "loadwb": out("Workbench is already running"); break;
    case "format": case "delete": case "initialize": out("Not on this disk, you don't."); break;
    case "cls": case "clear": sh.lines = []; break;
    case "endcli": case "endshell": case "exit": { const w = wins.find(x => x.id === "shell"); if (w) closeWin(w); break; }
    case "guru": guru(); break;
    default: out("Unknown command " + c0);
  }
  if (sh.lines.length > 300) sh.lines.splice(0, sh.lines.length - 300);
}

/* ---------- menus ----------------------------------------------------- */
const selIcon = () => allIcons().find(ic => ic.sel) || null;
const NO = () => false;
const MENUS = [
  { t:"Workbench", items:[
    ["Open",      () => !!selIcon(), () => { const ic = selIcon(); if (ic) ic.act(); }],
    ["Close",     () => !!active,    () => closeWin(active)],
    ["Duplicate", NO], ["Rename", NO], ["Info", NO], ["Discard", NO] ]},
  { t:"Disk", items:[ ["Empty Trash", NO], ["Initialize", NO] ]},
  { t:"Special", items:[
    ["Clean Up",   () => true, () => { if (active && active.type === "drawer") layoutIcons(active); else layoutDesk(true); }],
    ["Last Error", NO],
    ["Redraw",     () => true, () => {}],
    ["Snapshot",   NO],
    ["Version",    () => true, () => { titleMsg = { t:"Kickstart version 34.5. Workbench version 34.34", until:performance.now() + 5000 }; }] ]}
];
(() => { let x = 4; for (const m of MENUS) { m.x = x; m.w = m.t.length * 8 + 8; x += m.w + 8;
  m.dw = Math.max(...m.items.map(i => i[0].length)) * 8 + 16; } })();
const dropRect = m => ({ x: Math.min(m.x, LW - m.dw - 2), y: 10, w: m.dw, h: m.items.length * 9 + 4 });

function updMenu(p) {
  if (p.y < 10) {
    const i = MENUS.findIndex(m => p.x >= m.x && p.x < m.x + m.w);
    if (i >= 0) menu.cur = i;
    menu.ii = -1;
  } else if (menu.cur >= 0) {
    const d = dropRect(MENUS[menu.cur]);
    menu.ii = (p.x >= d.x && p.x < d.x + d.w && p.y >= d.y + 2 && p.y < d.y + d.h - 2)
      ? clamp(Math.floor((p.y - d.y - 2) / 9), 0, MENUS[menu.cur].items.length - 1) : -1;
  }
}
function runMenu() {
  if (!menu || menu.cur < 0 || menu.ii < 0) return;
  const it = MENUS[menu.cur].items[menu.ii];
  if (it && it[1]() && it[2]) it[2]();
}
function drawMenus() {
  fill(0, 0, LW, 10, WH);
  MENUS.forEach((m, i) => { text(m.t, m.x + 4, 1, BL); if (i === menu.cur) comp(m.x, 0, m.w, 10); });
  if (menu.cur < 0) return;
  const m = MENUS[menu.cur], d = dropRect(m);
  fill(d.x, d.y, d.w, d.h, WH); frame(d.x, d.y, d.w, d.h, BK);
  m.items.forEach((it, i) => {
    const iy = d.y + 2 + i * 9;
    text(it[0], d.x + 6, iy + 1, BL);
    if (!it[1]()) { ctx.fillStyle = WH; for (let yy = iy; yy < iy + 9; yy++) for (let xx = d.x + 2 + (yy & 1); xx < d.x + d.w - 2; xx += 2) ctx.fillRect(xx, yy, 1, 1); }
    else if (i === menu.ii) comp(d.x + 2, iy, d.w - 4, 9);
  });
}

/* ---------- boot & guru ----------------------------------------------- */
const BOOT = [
  "Copyright © 1987 Commodore-Amiga, Inc.",
  "All rights reserved.",
  "Release 1.3",
  "faf.net Workbench Disk. Release 1.3.3 version 34.34"
];
let boot = { lines:[], cur:"", skip:false }, wake = null;
async function runBoot() {
  mode = "boot"; wins = []; active = null; drag = null; menu = null; titleMsg = null;
  deselectAll(); layoutDesk(true);
  boot = { lines:[], cur:"", skip:reduce };
  const b = boot;
  const sl = ms => b.skip ? Promise.resolve() : new Promise(r => { const t = setTimeout(r, ms); wake = () => { clearTimeout(t); r(); }; });
  await sl(450);
  for (const l of BOOT) { b.lines.push(l); dirty(); await sl(160); }
  await sl(450);
  for (const cmd of ["LoadWB", "EndCLI"]) {
    b.cur = "1> "; dirty(); await sl(380);
    for (const ch of cmd) { b.cur += ch; dirty(); await sl(85); }
    await sl(300); b.lines.push(b.cur); b.cur = ""; dirty(); await sl(150);
  }
  if (b !== boot) return;
  mode = "wb"; openDisk(); busy(900); dirty();
}
function skipBoot() { boot.skip = true; if (wake) wake(); }
function renderBoot() {
  fill(0, 0, LW, LH, BL);
  titleBar(0, 0, LW, "AmigaDOS", true, false);
  const cols = Math.max(1, Math.floor((LW - 4) / 8)), rows = [];
  boot.lines.forEach(s => wrapInto(rows, s, cols));
  wrapInto(rows, boot.cur, cols);
  rows.forEach((s, i) => text(s, 2, 12 + i * 8, WH));
  fill(2 + rows[rows.length - 1].length * 8, 12 + (rows.length - 1) * 8, 8, 8, OR);
}

function guru() { mode = "guru"; menu = null; drag = null; kbd.blur(); dirty(); }
function renderGuru() {
  fill(0, 0, LW, LH, "#000000");
  const narrow = LW < 480;
  const L = narrow ? ["Software Failure.", "Press left mouse button to continue.", "Guru Meditation #00000004.0000AAC0"]
                   : ["Software Failure.    Press left mouse button to continue.", "Guru Meditation #00000004.0000AAC0"];
  const h = L.length * 12 + 18;
  if (Math.floor(Date.now() / 800) % 2 === 0) { fill(0, 0, LW, h, GURU); fill(8, 3, LW - 16, h - 6, "#000000"); }
  L.forEach((s, i) => text(s, (LW - s.length * 8) >> 1, 9 + i * 12, GURU));
}

/* ---------- render ---------------------------------------------------- */
function render() {
  if (mode === "guru") { renderGuru(); return; }
  if (mode === "boot") { renderBoot(); drawPointer(); return; }

  fill(0, 0, LW, LH, BL);
  const now = performance.now();
  if (titleMsg && now > titleMsg.until) titleMsg = null;
  fill(0, 0, LW, 10, WH);
  text(titleMsg ? titleMsg.t : "Workbench release.    " + freeMem() + " free memory", 4, 1, BL);
  depthGadgets(LW - 46, -1);

  deskIcons.forEach(ic => drawIcon(ic, 0, 0));
  wins.forEach(drawWin);

  if (drag && drag.k === "move") compFrame(drag.nx, drag.ny, drag.w.w, drag.w.h);
  if (drag && drag.k === "size") compFrame(drag.w.x, drag.w.y, drag.nw, drag.nh);
  if (menu) drawMenus();
  drawPointer();
}
function drawPointer() {
  if (!hasMouse || ptr.x < 0) return;
  if (performance.now() < busyUntil) drawBusy(ptr.x, ptr.y); else drawSprite(POINTER, ptr.x, ptr.y);
}
let raf = 0;
function dirty() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }
setInterval(dirty, 250);

/* ---------- sizing ---------------------------------------------------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const dw = Math.round(innerWidth * dpr), dh = Math.round(innerHeight * dpr);
  let k = Math.max(1, Math.round(dh / 512));
  while (k > 1 && (dw / k < 320 || dh / (2 * k) < 180)) k--;
  LW = Math.floor(dw / k); LH = Math.floor(dh / (2 * k));
  cv.width = LW; cv.height = LH;
  const cssW = LW * k / dpr, cssH = LH * 2 * k / dpr;
  cv.style.width = scan.style.width = cssW + "px";
  cv.style.height = scan.style.height = cssH + "px";
  scan.style.backgroundSize = "100% " + (2 * k / dpr) + "px";
  ctx.imageSmoothingEnabled = false;
  layoutDesk(false);
  wins.forEach(w => {
    w.w = Math.min(w.w, LW); w.h = Math.min(w.h, LH);
    w.x = clamp(w.x, 0, LW - w.w); w.y = clamp(w.y, 0, LH - w.h);
  });
  render();
}
addEventListener("resize", resize);

/* ---------- input ----------------------------------------------------- */
function toL(e) {
  const r = cv.getBoundingClientRect();
  return { x: Math.floor((e.clientX - r.left) * LW / r.width), y: Math.floor((e.clientY - r.top) * LH / r.height) };
}
function winAt(p) {
  for (let i = wins.length - 1; i >= 0; i--) {
    const w = wins[i];
    if (p.x >= w.x && p.y >= w.y && p.x < w.x + w.w && p.y < w.y + w.h) return w;
  }
  return null;
}
function hitPart(w, x, y) {
  if (y < w.y + 11) {
    if (x < w.x + 21) return "close";
    if (x >= w.x + w.w - 23) return "front";
    if (x >= w.x + w.w - 46) return "back";
    return "drag";
  }
  const dr = w.type === "drawer";
  if (x >= w.x + w.w - (dr ? 18 : 20) && y >= w.y + w.h - (dr ? 9 : 11)) return "size";
  const c = content(w);
  if (x >= c.x && y >= c.y && x < c.x + c.w && y < c.y + c.h) return "content";
  return "border";
}
function iconDown(list, x, y, win, p) {
  const ic = iconHit(list, x, y);
  deselectAll();
  if (!ic) return;
  ic.sel = true;
  const now = performance.now();
  if (lastClick.ic === ic && now - lastClick.t < 500) { lastClick.ic = null; ic.act(); return; }
  lastClick = { ic, t: now };
  drag = { k:"icon", ic, win, px:p.x, py:p.y, cx:ic.cx, cy:ic.y, moved:false };
}
const shellActive = () => active && active.type === "shell";
function focusKbd() { if (shellActive()) kbd.focus({ preventScroll:true }); }

cv.addEventListener("contextmenu", e => e.preventDefault());

cv.addEventListener("pointerdown", e => {
  const p = toL(e); ptr = p;
  if (e.pointerType === "mouse") { hasMouse = true; document.body.classList.add("mouse"); }
  e.preventDefault();
  if (mode === "boot") { skipBoot(); return; }
  if (mode === "guru") { if (e.button === 0) runBoot(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}

  if (e.button === 2) { menu = { sticky:false, cur:-1, ii:-1 }; updMenu(p); dirty(); return; }
  if (e.button !== 0) return;

  if (menu && menu.sticky) {               // touch: menu strip stays open
    updMenu(p);
    if (p.y < 10 && MENUS.some(m => p.x >= m.x && p.x < m.x + m.w)) { dirty(); return; }
    runMenu(); menu = null; dirty(); return;
  }
  if (p.y < 10 && e.pointerType !== "mouse" && !winAt(p)) {
    menu = { sticky:true, cur:-1, ii:-1 }; updMenu(p); dirty(); return;
  }

  const w = winAt(p);
  if (w) {
    active = w;
    const part = hitPart(w, p.x, p.y);
    if (part === "back") { wins.splice(wins.indexOf(w), 1); wins.unshift(w); }
    else if (part === "front") raise(w);
    else {
      raise(w);
      if (part === "close") drag = { k:"close", w };
      else if (part === "drag") drag = { k:"move", w, ox:p.x - w.x, oy:p.y - w.y, nx:w.x, ny:w.y };
      else if (part === "size") drag = { k:"size", w, ox:w.x + w.w - p.x, oy:w.y + w.h - p.y, nw:w.w, nh:w.h };
      else if (part === "content" && w.type === "drawer") { const c = content(w); iconDown(w.icons, p.x - c.x, p.y - c.y, w, p); }
      else deselectAll();
    }
  } else {
    iconDown(deskIcons, p.x, p.y, null, p);
  }
  if (!shellActive()) kbd.blur();
  dirty();
});

cv.addEventListener("pointermove", e => {
  const p = toL(e); ptr = p;
  if (e.pointerType === "mouse" && !hasMouse) { hasMouse = true; document.body.classList.add("mouse"); }
  if (menu) updMenu(p);
  if (drag) {
    const w = drag.w;
    if (drag.k === "move") { drag.nx = clamp(p.x - drag.ox, 0, LW - w.w); drag.ny = clamp(p.y - drag.oy, 0, LH - w.h); }
    else if (drag.k === "size") { drag.nw = clamp(p.x + drag.ox - w.x, 120, LW - w.x); drag.nh = clamp(p.y + drag.oy - w.y, 40, LH - w.y); }
    else if (drag.k === "icon") {
      const dx = p.x - drag.px, dy = p.y - drag.py;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      if (drag.moved) { drag.ic.cx = drag.cx + dx; drag.ic.y = drag.cy + dy; }
    }
  }
  dirty();
});

cv.addEventListener("pointerup", e => {
  const p = toL(e);
  if (menu && !menu.sticky && e.button === 2) { runMenu(); menu = null; }
  if (drag) {
    const w = drag.w;
    if (drag.k === "move") { w.x = drag.nx; w.y = drag.ny; }
    else if (drag.k === "size") { w.w = drag.nw; w.h = drag.nh; }
    else if (drag.k === "close") { if (winAt(p) === w && hitPart(w, p.x, p.y) === "close") closeWin(w); }
    else if (drag.k === "icon" && drag.moved) {
      const ic = drag.ic;
      if (drag.win) { const c = content(drag.win); ic.cx = clamp(ic.cx, 8, Math.max(8, c.w - 8)); ic.y = clamp(ic.y, 0, Math.max(0, c.h - 12)); }
      else { ic.cx = clamp(ic.cx, 16, LW - 16); ic.y = clamp(ic.y, 11, LH - 30); ic.rx = LW - ic.cx; }
      lastClick.ic = null;
    }
    drag = null;
  }
  focusKbd();
  dirty();
});
cv.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !drag) { ptr = { x:-99, y:-99 }; dirty(); } });

// keyboard → shell
function shellKey(e) {
  if (!shellActive() || mode !== "wb") return false;
  if (e.key === "Enter") { exec(sh.inp); sh.inp = ""; }
  else if (e.key === "Backspace") sh.inp = sh.inp.slice(0, -1);
  else if (e.key === "ArrowUp")   { if (sh.hp > 0) sh.inp = sh.hist[--sh.hp]; }
  else if (e.key === "ArrowDown") { if (sh.hp < sh.hist.length) { sh.hp++; sh.inp = sh.hist[sh.hp] || ""; } }
  else return false;
  dirty(); return true;
}
kbd.addEventListener("keydown", e => { if (shellKey(e)) e.preventDefault(); });
kbd.addEventListener("input", () => {
  const v = kbd.value; kbd.value = "";
  if (!shellActive()) return;
  for (const ch of v) {
    if (ch === "\n") { exec(sh.inp); sh.inp = ""; }
    else if (sh.inp.length < 200) sh.inp += (ch.charCodeAt(0) <= 255 ? ch : "?");
  }
  dirty();
});
addEventListener("keydown", e => {
  if (e.target === kbd || !shellActive()) return;
  if (shellKey(e)) { e.preventDefault(); }
  else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { sh.inp += e.key; e.preventDefault(); dirty(); }
  kbd.focus({ preventScroll:true });
});

if (theme !== "amiga") setTheme(theme);
resize();
runBoot();
})();
</script>
</body>
